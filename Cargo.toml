[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/chunking",
    "crates/retrieval",
    "crates/reranking",
    "crates/calibration",
    "crates/context",
    "crates/document",
    "crates/diagnostics",
    "crates/embeddings",
    "crates/observability",
    "crates/orchestration",
    "crates/storage",
    "crates/pipeline",
    "crates/benchmarks",
    "crates/examples",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["RedHop Contributors"]
repository = "https://github.com/redhop/redhop"
homepage = "https://github.com/redhop/redhop"
description = "Reasoning-preserving context optimization and retrieval observability for RAG systems"
keywords = ["rag", "retrieval", "llm", "context", "nlp"]
categories = ["text-processing", "science"]

[workspace.dependencies]
# Workspace-internal crates
redhop-core        = { path = "crates/core" }
redhop-chunking    = { path = "crates/chunking" }
redhop-retrieval   = { path = "crates/retrieval" }
redhop-reranking   = { path = "crates/reranking" }
redhop-calibration    = { path = "crates/calibration" }
redhop-context        = { path = "crates/context" }
redhop-document       = { path = "crates/document" }
redhop-diagnostics    = { path = "crates/diagnostics" }
redhop-embeddings     = { path = "crates/embeddings" }
redhop-observability  = { path = "crates/observability" }
redhop-orchestration  = { path = "crates/orchestration" }
redhop-storage        = { path = "crates/storage" }
redhop-pipeline       = { path = "crates/pipeline" }

# Core runtime / concurrency
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
rayon    = "1.10"
futures  = "0.3"

# Serialization / error handling
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Text / tokenization
unicode-segmentation = "1.11"
regex                = "1.10"

# Optional heavyweight backends (gated behind features in their crates)
tantivy = "0.22"

# Bench / test
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1
