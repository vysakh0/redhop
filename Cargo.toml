[workspace]
resolver = "2"
members = [
    "crates/redhop",
    "crates/benchmarks",
    "crates/examples",
    "crates/cli",
    "examples/rust",
]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused = "warn"

[workspace.lints.clippy]
# Opinionated baseline: the standard clippy groups are warnings, enforced as
# errors in CI (`cargo clippy -- -D warnings`). priority -1 lets the specific
# allows below win.
all = { level = "warn", priority = -1 }
# Deliberately permitted: index-based loops are clearer than iterator chains in
# numeric / parallel-array kernels (pooling, centroids, bootstrap), and this is
# a style call, not a correctness one.
needless_range_loop = "allow"

[workspace.package]
version = "0.5.0"
edition = "2021"
# Workspace-wide MSRV — set to the highest minimum any member requires.
# napi-rs 2.x (used by `nodejs/`) needs 1.77; the published `redhop` crate
# compiles fine on older toolchains, but the workspace as a whole is
# tested against this floor. Bump in lockstep with what CI actually
# exercises, not aspirationally.
rust-version = "1.77"
license = "Apache-2.0"
authors = ["Vysakh Sreenivasan", "RedHop Contributors"]
repository = "https://github.com/vysakh0/redhop"
homepage = "https://www.redhopai.com"
# Points crates.io readers at docs.rs explicitly so the package page
# links to the rendered API reference (which includes the `files` and
# `semantic` items thanks to `[package.metadata.docs.rs] all-features =
# true` in `crates/redhop/Cargo.toml`).
documentation = "https://docs.rs/redhop"
description = "RedHop — a reasoning-preserving retrieval & context runtime for RAG: chunk, retrieve, and allocate the document context an LLM should see, with citations and a Decision Report."
keywords = ["rag", "retrieval", "llm", "context", "nlp"]
categories = ["text-processing", "science"]

[workspace.dependencies]
# The single published crate. Internal workspace members (cli, benchmarks,
# examples) depend on `redhop` directly.
redhop = { path = "crates/redhop" }

# Core runtime / concurrency
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
rayon    = "1.10"
futures  = "0.3"

# Serialization / error handling
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Text / tokenization
unicode-segmentation = "1.11"
regex                = "1.10"

# Optional heavyweight backends (gated behind features in their crates)
tantivy = "0.22"

# Bench / test
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1
