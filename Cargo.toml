[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/chunking",
    "crates/retrieval",
    "crates/reranking",
    "crates/calibration",
    "crates/diagnostics",
    "crates/orchestration",
    "crates/storage",
    "crates/pipeline",
    "crates/benchmarks",
    "crates/examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["NeoRAG Contributors"]
repository = "https://github.com/neorag/neorag"
description = "Adaptive evidence retrieval infrastructure"

[workspace.dependencies]
# Workspace-internal crates
neorag-core        = { path = "crates/core" }
neorag-chunking    = { path = "crates/chunking" }
neorag-retrieval   = { path = "crates/retrieval" }
neorag-reranking   = { path = "crates/reranking" }
neorag-calibration    = { path = "crates/calibration" }
neorag-diagnostics    = { path = "crates/diagnostics" }
neorag-orchestration  = { path = "crates/orchestration" }
neorag-storage        = { path = "crates/storage" }
neorag-pipeline       = { path = "crates/pipeline" }

# Core runtime / concurrency
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
rayon    = "1.10"
futures  = "0.3"

# Serialization / error handling
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Text / tokenization
unicode-segmentation = "1.11"
regex                = "1.10"

# Optional heavyweight backends (gated behind features in their crates)
tantivy = "0.22"

# Bench / test
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1
