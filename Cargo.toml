[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/chunking",
    "crates/retrieval",
    "crates/reranking",
    "crates/calibration",
    "crates/context",
    "crates/document",
    "crates/diagnostics",
    "crates/embeddings",
    "crates/files",
    "crates/observability",
    "crates/orchestration",
    "crates/storage",
    "crates/pipeline",
    "crates/benchmarks",
    "crates/examples",
    "crates/cli",
    "crates/redhop",
]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused = "warn"

[workspace.lints.clippy]
# Opinionated baseline: the standard clippy groups are warnings, enforced as
# errors in CI (`cargo clippy -- -D warnings`). priority -1 lets the specific
# allows below win.
all = { level = "warn", priority = -1 }
# Deliberately permitted: index-based loops are clearer than iterator chains in
# numeric / parallel-array kernels (pooling, centroids, bootstrap), and this is
# a style call, not a correctness one.
needless_range_loop = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Vysakh Sreenivasan", "RedHop Contributors"]
repository = "https://github.com/vysakh0/redhop"
homepage = "https://github.com/vysakh0/redhop"
description = "RedHop — a reasoning-aware retrieval & context runtime for RAG: chunk, retrieve, and allocate the document context an LLM should see, with citations and a Decision Report."
keywords = ["rag", "retrieval", "llm", "context", "nlp"]
categories = ["text-processing", "science"]

[workspace.dependencies]
# Workspace-internal crates. The `version` is required for crates.io: on publish,
# cargo strips the path and depends on the registry version, so these must track
# `[workspace.package] version` above.
redhop-core        = { path = "crates/core", version = "0.1.0" }
redhop-chunking    = { path = "crates/chunking", version = "0.1.0" }
redhop-retrieval   = { path = "crates/retrieval", version = "0.1.0" }
redhop-reranking   = { path = "crates/reranking", version = "0.1.0" }
redhop-calibration    = { path = "crates/calibration", version = "0.1.0" }
redhop-context        = { path = "crates/context", version = "0.1.0" }
redhop-document       = { path = "crates/document", version = "0.1.0" }
redhop-diagnostics    = { path = "crates/diagnostics", version = "0.1.0" }
redhop-embeddings     = { path = "crates/embeddings", version = "0.1.0" }
redhop-observability  = { path = "crates/observability", version = "0.1.0" }
redhop-orchestration  = { path = "crates/orchestration", version = "0.1.0" }
redhop-storage        = { path = "crates/storage", version = "0.1.0" }
redhop-pipeline       = { path = "crates/pipeline", version = "0.1.0" }

# Core runtime / concurrency
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
rayon    = "1.10"
futures  = "0.3"

# Serialization / error handling
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Text / tokenization
unicode-segmentation = "1.11"
regex                = "1.10"

# Optional heavyweight backends (gated behind features in their crates)
tantivy = "0.22"

# Bench / test
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1
