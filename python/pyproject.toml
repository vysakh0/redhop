[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "redhop"
version = "0.1.2"
description = "Reasoning-aware context runtime for RAG — chunk, retrieve, and allocate the document context an LLM should see, with citations and a Decision Report. In-process, no vector DB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["rag", "retrieval", "llm", "context", "nlp"]
authors = [{ name = "Vysakh Sreenivasan" }, { name = "RedHop Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# Note: no optional-dependencies. The semantic embedding engine and the document
# parsers are compiled into the single self-contained wheel (no Python deps, no
# separate runtime), so `pip install redhop` includes everything — a pip extra
# can't gate native code anyway.

[project.urls]
Homepage = "https://github.com/vysakh0/redhop"
Repository = "https://github.com/vysakh0/redhop"

[tool.maturin]
module-name = "redhop._redhop"
python-source = "."
features = ["pyo3/extension-module"]
# Ship the LICENSE inside the sdist too (the metadata declares License-File: LICENSE;
# PyPI rejects the sdist if the file isn't in the tarball).
include = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
# The compiled extension lives in redhop/_redhop; nothing to lint there.
extend-exclude = ["redhop/_redhop*", "target"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP),
# comprehensions (C4) — a sensible, non-fussy default.
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert that *some* error is raised, and use dict() kwargs.
"tests/*" = ["B017", "C408"]
# examples/ and eval/ are demonstration + research scripts, not shipped library
# code — script-level conveniences (single-letter vars, lambdas, %-format) are fine.
"examples/*" = ["E741", "E731", "UP031", "C408"]
"eval/*" = ["E741", "E731", "UP031", "C408"]
