# Standalone workspace: keeps the pyo3 cdylib out of the pure-Rust workspace
# build (so `cargo build --workspace` at the repo root never needs Python).
[workspace]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_range_loop = "allow"

[package]
name = "redhop-py"
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
description = "Python bindings for RedHop context optimization"

[lib]
name = "_redhop"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Semantic retrieval tier: the local embedding model behind retrieval="hybrid"
# and retrieval="semantic". Off by default so the base wheel stays lean; the
# published `redhop[semantic]` wheel is built with it.
semantic = ["redhop/semantic"]
# Deprecated alias for `semantic` — kept so existing build commands still work.
onnx = ["semantic"]
# `redhop[files]` parsing tier: Document.from_file/from_folder for
# DOCX/PPTX/XLSX/PDF (text/markdown/code work without it).
files = ["redhop/files"]

# Per-platform Execution Provider (EP) opt-ins for the semantic tier. Each
# pulls in the matching ort EP at build time; ORT falls back to CPU for any
# op an EP can't run, so enabling these is safe. The published wheels per
# platform pick the right one (see .github/workflows/release-python.yml):
# Mac → ep-coreml, Linux x86_64 + Windows → ep-onednn, Linux aarch64 →
# ep-xnnpack. See docs/design/HYBRID_ACCELERATION_PLAN.md.
ep-coreml   = ["semantic", "redhop/ep-coreml"]
ep-onednn   = ["semantic", "redhop/ep-onednn"]
ep-xnnpack  = ["semantic", "redhop/ep-xnnpack"]
ep-directml = ["semantic", "redhop/ep-directml"]
ep-cuda     = ["semantic", "redhop/ep-cuda"]

[dependencies]
# Single consolidated dep. `default-features = false` keeps the base wheel
# lean — `semantic` / `files` get pulled in only by the matching pyo3 features.
redhop     = { path = "../crates/redhop", default-features = false }
ignore     = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3       = { version = "0.23", features = ["extension-module", "abi3-py39"] }

[lints]
workspace = true
