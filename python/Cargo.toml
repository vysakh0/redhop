# Standalone workspace: keeps the pyo3 cdylib out of the pure-Rust workspace
# build (so `cargo build --workspace` at the repo root never needs Python).
[workspace]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
needless_range_loop = "allow"

[package]
name = "redhop-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Python bindings for RedHop context optimization"

[lib]
name = "_redhop"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Off by default: the standard wheel is lexical-only (no native ONNX runtime).
# Build with `--features onnx` for the dense-rerank retrieval tier.
onnx = ["redhop-embeddings/onnx"]
# Build with `--features files` for Document.from_file parsing
# (text/markdown/DOCX today; PPTX/XLSX/PDF coming).
files = ["dep:redhop-files"]

[dependencies]
redhop-core       = { path = "../crates/core" }
redhop-context    = { path = "../crates/context" }
redhop-document   = { path = "../crates/document" }
redhop-embeddings = { path = "../crates/embeddings", default-features = false }
redhop-files      = { path = "../crates/files", optional = true }
serde_json      = "1"
pyo3           = { version = "0.23", features = ["extension-module", "abi3-py39"] }

[lints]
workspace = true
