<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Sample Decision Report — terminal rendering">
  <title>Sample Decision Report (terminal output)</title>
  <desc>What RedHop's ContextReport prints — the assembly decision, the reason, the diagnostics — rendered as a stylised terminal screenshot.</desc>

  <!-- Window background -->
  <rect width="760" height="420" rx="10" fill="#0f172a"/>

  <!-- Window chrome bar -->
  <rect x="0" y="0" width="760" height="32" rx="10" fill="#1e293b"/>
  <rect x="0" y="22" width="760" height="10" fill="#1e293b"/>
  <circle cx="20" cy="16" r="6" fill="#ef4444"/>
  <circle cx="40" cy="16" r="6" fill="#eab308"/>
  <circle cx="60" cy="16" r="6" fill="#22c55e"/>
  <text x="380" y="20" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">
    redhop · ContextReport
  </text>

  <!--
    Body. Use monospace font.
    Line height = 18.
    Top of body content: y = 62.
  -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13">
    <!-- prompt -->
    <text x="24" y="62" fill="#22c55e">$</text>
    <text x="40" y="62" fill="#cbd5e1">print(ctx.report)</text>

    <!-- header -->
    <text x="24" y="92" fill="#f1f5f9" font-weight="600">RedHop Decision Report</text>
    <text x="24" y="110" fill="#475569">══════════════════════</text>

    <!-- decision line -->
    <text x="24" y="140" fill="#cbd5e1">Decision:</text>
    <text x="104" y="140" fill="#e11d48" font-weight="600">Auto → pruning</text>
    <text x="236" y="140" fill="#94a3b8">(intervened on a diluted context)</text>

    <!-- Why -->
    <text x="24" y="170" fill="#cbd5e1">  Why:</text>
    <text x="40" y="190" fill="#94a3b8">- large/diluted contexts dilute attention; pruning recovers signal</text>

    <!-- Result -->
    <text x="24" y="218" fill="#cbd5e1">  Result:</text>
    <text x="40" y="238" fill="#94a3b8">- removed distractor chunks, kept all query-relevant evidence</text>
    <text x="40" y="256" fill="#94a3b8">- preserved a second-hop link a plain relevance filter would drop</text>

    <!-- Diagnostics header -->
    <text x="24" y="288" fill="#f1f5f9" font-weight="600">Diagnostics</text>
    <text x="24" y="306" fill="#475569">───────────</text>

    <!-- key/value pairs -->
    <text x="24" y="330" fill="#cbd5e1">  Chunks:</text>
    <text x="180" y="330" fill="#22d3ee">24</text>
    <text x="204" y="330" fill="#475569">→</text>
    <text x="218" y="330" fill="#22d3ee">3</text>

    <text x="24" y="348" fill="#cbd5e1">  Second-hop rescues:</text>
    <text x="180" y="348" fill="#22d3ee">1</text>

    <text x="24" y="366" fill="#cbd5e1">  Retained evidence:</text>
    <text x="180" y="366" fill="#22d3ee">1.00</text>

    <text x="24" y="384" fill="#cbd5e1">  Total tokens:</text>
    <text x="180" y="384" fill="#22d3ee">312</text>
    <text x="208" y="384" fill="#475569">/ 8192</text>

    <!-- next prompt -->
    <text x="24" y="406" fill="#22c55e">$</text>
    <rect x="38" y="396" width="9" height="14" fill="#94a3b8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
