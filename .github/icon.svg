    <path d="M40 14 C 31 19, 24 25, 24 32"/>
    <path d="M40 14 C 44 21, 45 28, 45 35"/>
  </g>
  <path d="M40 14 C 46 5, 57 5, 60 11 C 54 17, 45 17, 40 14 Z" fill="#9f1239"/>
  <circle cx="23" cy="45" r="13" fill="#be123c"/>
  <circle cx="44" cy="47" r="12" fill="#be123c"/>
  <ellipse cx="18" cy="40" rx="3.5" ry="2.2" fill="#fff" opacity="0.28" transform="rotate(-30 18 40)"/>
</svg>
