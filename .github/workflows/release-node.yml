# Build the `redhop` Node binding (.node) for each platform in package.json's
# `napi.triples`, then publish the main package + per-platform optional packages
# to npm on a `v*` tag.
#
# IMPORTANT: the matrix targets below must match `napi.triples` in nodejs/package.json,
# or `napi prepublish` will reference platform packages that were never built. To add a
# target (e.g. aarch64-unknown-linux-gnu), add it in BOTH places — the arm-linux/musl
# targets need a cross toolchain and an ORT build for that target, so tune them with a
# real run before relying on them.
#
# Secrets: NPM_TOKEN (an npm automation token with publish rights).
name: release-node

on:
  workflow_dispatch:   # manual release only — run from the Actions tab

permissions:
  contents: read

defaults:
  run:
    working-directory: nodejs

jobs:
  build:
    name: build · ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ── 0.1.0 Windows retry (TEMPORARY) ────────────────────────────────────
          # These 4 platform packages already shipped at 0.1.0 (immutable on npm).
          # Re-enabled them after `redhop-win32-x64-msvc@0.1.0` lands. The Windows
          # publish previously hit npm's spam-detection on a metadata-thin platform
          # package; this run retries with enriched metadata from .npm-overrides/.
          # ──────────────────────────────────────────────────────────────────────
          # - { host: macos-14,         target: x86_64-apple-darwin }
          # - { host: macos-14,         target: aarch64-apple-darwin }
          # - { host: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          # - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nodejs
      - run: npm install
      - name: Build
        run: npx napi build --platform --release --target ${{ matrix.settings.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: nodejs/*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    env:
      # Available to BOTH `napi prepublish` (publishes the per-platform packages) and
      # the final `npm publish` (the main package). Scoping it to only the last step
      # would 401 the platform-package uploads.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: nodejs/artifacts
      - name: Assemble per-platform npm packages
        run: |
          npx napi create-npm-dir -t .
          npx napi artifacts --dir artifacts
          # ── 0.1.0 Windows retry (TEMPORARY) ────────────────────────────────────
          # Override the napi-generated thin metadata for the Windows platform
          # package with full legitimacy signals (repository / homepage / bugs /
          # author + a substantive README). The earlier attempt hit npm's spam
          # detector with the 86 B placeholder README and 8-field package.json.
          cp .npm-overrides/win32-x64-msvc/package.json npm/win32-x64-msvc/package.json
          cp .npm-overrides/win32-x64-msvc/README.md    npm/win32-x64-msvc/README.md
      - name: Publish Windows platform package only
        # ── 0.1.0 Windows retry (TEMPORARY) ──────────────────────────────────────
        # The other 3 platform packages and the `redhop` meta are already on the
        # registry at 0.1.0 (immutable). Skipping `napi prepublish` and the meta
        # `npm publish` — they'd 403 against the immutable versions. We publish
        # ONLY the Windows package directly. Restore the full publish flow before
        # the next release.
        run: |
          cd npm/win32-x64-msvc
          npm publish --access public
