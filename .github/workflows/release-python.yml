# Build the self-contained `redhop` wheels (semantic + files compiled in) for every
# supported platform and publish to PyPI on a `v*` tag.
#
# First-run notes:
#  - The `ort` crate downloads the ONNX Runtime at *build* time (network needed on the
#    runner). The aarch64-linux job cross-builds under QEMU/manylinux — if ORT lacks a
#    prebuilt for that target it'll fail; drop that row or switch to a native arm runner.
#  - Publishing uses PyPI Trusted Publishing (OIDC) — configure the publisher for this
#    repo + the `pypi` environment on PyPI; no token secret required.
name: release-python

on:
  workflow_dispatch:   # manual release only — run from the Actions tab

permissions:
  contents: read

jobs:
  wheels:
    name: wheels · ${{ matrix.platform.runner }} · ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: auto }
          - { runner: macos-13,       target: x86_64 }
          - { runner: macos-14,       target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          # The project lives in python/ (its own pyproject + Cargo.toml). Build the
          # one self-contained wheel with the semantic engine + file parsers compiled in.
          args: --release --out dist -m python/Cargo.toml --features semantic,files
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
