# Build the self-contained `redhop` wheels (semantic + files compiled in) for every
# supported platform and publish to PyPI on a `v*` tag.
#
# First-run notes:
#  - The `ort` crate downloads the ONNX Runtime at *build* time (network needed on the
#    runner). The aarch64-linux job cross-builds under QEMU/manylinux — if ORT lacks a
#    prebuilt for that target it'll fail; drop that row or switch to a native arm runner.
#  - Publishing uses PyPI Trusted Publishing (OIDC) — configure the publisher for this
#    repo + the `pypi` environment on PyPI; no token secret required.
name: release-python

on:
  # Primary trigger: push a `v0.1.4`-style tag → matrix wheels + sdist
  # + PyPI publish, gated on tag/source version match.
  push:
    tags: ['v*']
  # Escape hatch: re-run from the Actions tab (e.g., to retry a single
  # platform that hit a transient build error).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Single fast guard before the matrix fans out — avoids paying for 5 wheel
  # builds when the tag was pushed with stale source.
  verify-version:
    name: verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION=$(grep -E '^version ?= ?"' python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} resolves to version ${TAG_VERSION}, but python/pyproject.toml says ${SRC_VERSION}. Refusing to build."
            exit 1
          fi
          echo "✓ tag ${TAG_VERSION} matches pyproject.toml ${SRC_VERSION}"

  wheels:
    name: wheels · ${{ matrix.platform.runner }} · ${{ matrix.platform.target }}
    needs: verify-version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # manylinux_2_28 (AlmaLinux 8) ships OpenSSL 1.1.1, which openssl-sys needs
          # (manylinux2014/CentOS 7 has 1.0.2, which it rejects).
          - { runner: ubuntu-latest,    target: x86_64,  manylinux: '2_28' }
          # aarch64-Linux on a native ARM runner (no QEMU → ring compiles natively).
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28' }
          # Both macOS targets on the arm64 runner: aarch64 native, x86_64 cross
          # (Apple's toolchain cross-compiles cleanly) — avoids the scarce macos-13 queue.
          - { runner: macos-14,         target: x86_64 }
          - { runner: macos-14,         target: aarch64 }
          - { runner: windows-latest,   target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          # The project lives in python/ (its own pyproject + Cargo.toml). Build the
          # one self-contained wheel with the semantic engine + file parsers compiled in.
          args: --release --out dist -m python/Cargo.toml --features semantic,files
          # ort-sys's build script downloads the ONNX Runtime via ureq+native-tls, so
          # the (minimal) manylinux container needs OpenSSL headers + pkg-config to
          # compile it. This is build-time only — it is NOT linked into the wheel.
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then yum install -y openssl-devel pkgconfig perl-IPC-Cmd
            elif command -v dnf >/dev/null 2>&1; then dnf install -y openssl-devel pkgconfig perl-IPC-Cmd
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache openssl-dev pkgconfig perl
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libssl-dev pkg-config; fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Don't fail if a file for this version is already on PyPI — lets a re-run
          # upload only the missing pieces (e.g. a fixed sdist) without choking on the
          # wheels that already uploaded.
          skip-existing: true
