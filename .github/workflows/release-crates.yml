# Publish the `redhop` crate to crates.io.
#
# Unlike PyPI/npm there is no platform matrix — `cargo publish` uploads a single
# source tarball and consumers build it on their machine. We do still verify
# that the heavy features (`files,semantic`) compile end-to-end before upload,
# so a broken release can't slip through.
#
# Secret: CARGO_REGISTRY_TOKEN (a crates.io API token with `publish-update` on
# the `redhop` crate — generated at https://crates.io/me).
name: release-crates

on:
  # Primary trigger: push a `v0.1.4`-style tag → publishes the matching crate
  # version (with a guard that the tag and `Cargo.toml` version agree).
  push:
    tags: ['v*']
  # Escape hatch: re-run a single ecosystem's publish from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # When tag-triggered, the tag's version MUST match the source's
      # `[workspace.package] version`. Otherwise a stale tag would publish
      # whatever's currently checked in, which is exactly the silent-failure
      # mode this guard exists to prevent.
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION=$(grep -E '^version ?= ?"' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} resolves to version ${TAG_VERSION}, but Cargo.toml says ${SRC_VERSION}. Refusing to publish."
            exit 1
          fi
          echo "✓ tag ${TAG_VERSION} matches Cargo.toml ${SRC_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ort-sys's build script downloads the ONNX Runtime via ureq+native-tls during
      # the verify-compile step (the same dance the PyPI workflow does). Build-time
      # only — nothing here ends up in the published tarball.
      - name: Install OpenSSL headers for the verify compile
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      # Dry-run with the heavy features so a broken release is caught before upload.
      # crates.io will publish the source tarball regardless of features (the consumer
      # picks them at build), but verifying these here means `cargo add redhop
      # --features files,semantic` is known-good for this exact tag.
      - name: Verify package + features compile
        run: cargo publish --dry-run -p redhop --features files,semantic

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # `--no-verify` because the previous step already did the verify compile —
        # repeating it adds ~minutes for no extra signal.
        run: cargo publish --no-verify -p redhop
