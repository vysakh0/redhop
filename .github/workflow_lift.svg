<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="CUAD retention lift across the detect → Stripper → Vocabulary workflow">
  <title>CUAD retention lift across the workflow (≥0.8 word-recall, n=300)</title>
  <desc>Horizontal-bar chart showing CUAD ≥0.8 retention rising from 81.3% on the raw 24-word template, to 87.7% after Stripper(boilerplate_terms), to 90.7% after also using Vocabulary(synonyms). LlamaIndex's 86% is shown as a vertical reference line. Note: this is RedHop with a workload-curated Vocabulary dictionary (34 keys, 121 synonyms compiled against CUAD's clause names) vs LlamaIndex with its default retriever; the same preprocessing is not applied to LlamaIndex in this comparison.</desc>

  <defs>
    <linearGradient id="bar-raw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bar-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="bar-expand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect width="760" height="460" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="380" y="36" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#0f172a">
    CUAD retention lift across the workflow
  </text>
  <text x="380" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" fill="#475569">
    ≥0.8 gold-evidence word-recall · n=300 · BM25 · budget 2,000 tok · default lexical retrieval throughout
  </text>

  <!-- ===== Plot geometry =====
       X axis spans 0 → 100% across pixel 220 → 700 (480px wide).
       So each percentage point = 4.8 px. Bars start at x=220.
       Y rows centered at 130, 220, 310. Each bar is 56px tall.
  -->

  <!-- X-axis tick lines + labels (0, 20, 40, 60, 80, 100) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">
    <line x1="220" y1="100" x2="220" y2="370" stroke="#cbd5e1" stroke-width="1"/>
    <text x="220" y="390" text-anchor="middle">0%</text>
    <line x1="316" y1="100" x2="316" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="316" y="390" text-anchor="middle">20%</text>
    <line x1="412" y1="100" x2="412" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="412" y="390" text-anchor="middle">40%</text>
    <line x1="508" y1="100" x2="508" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="508" y="390" text-anchor="middle">60%</text>
    <line x1="604" y1="100" x2="604" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="604" y="390" text-anchor="middle">80%</text>
    <line x1="700" y1="100" x2="700" y2="370" stroke="#cbd5e1" stroke-width="1"/>
    <text x="700" y="390" text-anchor="middle">100%</text>
  </g>

  <!-- ===== LlamaIndex 86% reference line ===== -->
  <!-- 86 * 4.8 + 220 = 632.8 -->
  <line x1="633" y1="90" x2="633" y2="378" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="633" y="84" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11" fill="#b45309" font-weight="600">
    LlamaIndex 86%
  </text>

  <!-- ===== Arm A: Raw 24-word template — 81.3% ===== -->
  <!-- Width = 81.3 * 4.8 = 390 -->
  <text x="210" y="135" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#0f172a">
    raw template
  </text>
  <text x="210" y="151" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" fill="#64748b">
    (24-word CUAD wrapper)
  </text>
  <rect x="220" y="120" width="390" height="36" rx="3" fill="url(#bar-raw)"/>
  <text x="615" y="143"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">
    81.3%
  </text>

  <!-- ===== Arm B: + drop_template_terms — 87.7% ===== -->
  <!-- Width = 87.7 * 4.8 = 421 -->
  <text x="210" y="225" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#0f172a">
    + drop_template_terms
  </text>
  <text x="210" y="241" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" fill="#64748b">
    (strip the wrapper at query boundary)
  </text>
  <rect x="220" y="210" width="421" height="36" rx="3" fill="url(#bar-strip)"/>
  <text x="646" y="233"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">
    87.7%
  </text>
  <text x="675" y="246"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="600" fill="#16a34a">
    +6.4
  </text>

  <!-- ===== Arm C: + expand_query_terms — 90.3% ===== -->
  <!-- Width = 90.3 * 4.8 = 433 -->
  <text x="210" y="315" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#0f172a">
    + expand_query_terms
  </text>
  <text x="210" y="331" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" fill="#64748b">
    (add workload synonyms to the query)
  </text>
  <rect x="220" y="300" width="433" height="36" rx="3" fill="url(#bar-expand)" stroke="#9f1239" stroke-width="0.8"/>
  <text x="658" y="323"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">
    90.3%
  </text>
  <text x="687" y="336"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="600" fill="#16a34a">
    +2.7
  </text>

  <!-- Best-in-class flag for the top bar -->
  <g transform="translate(640, 310)">
    <circle r="9" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M -3.5 0 L -1 2.5 L 3.5 -2.5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer note -->
  <text x="380" y="430" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" fill="#475569">
    Each step ships as a helper in the public API · `analyze_query_set` detects the template · `evaluate` scores the lift, no LLM judge
  </text>
  <text x="380" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="9" fill="#94a3b8">
    Sources: docs/findings/CUAD_RECALL_GAP.md + CUAD_CLAUSE_EXPANSION.md · raw: reports/framework_comparison_2026-06-06.txt
  </text>
</svg>
