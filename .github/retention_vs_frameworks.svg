<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="Evidence retention: RedHop vs LangChain vs LlamaIndex">
  <title>Evidence retention (≥0.8 word-recall, n=300) — RedHop vs LangChain vs LlamaIndex</title>
  <desc>Bar chart comparing evidence-retention rates across three RAG context runtimes on HotpotQA multi-hop and CUAD contracts.</desc>

  <!-- Background -->
  <rect width="760" height="460" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="380" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">
    Evidence retention vs frameworks (≥0.8 word-recall)
  </text>
  <text x="380" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569">
    n=300 per dataset · BM25 retrieval · forced-selection token budgets · same documents
  </text>

  <!-- Y axis grid lines + labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">
    <!-- 0% -->
    <line x1="90" y1="380" x2="720" y2="380" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="384" text-anchor="end">0%</text>
    <!-- 20% -->
    <line x1="90" y1="320" x2="720" y2="320" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="324" text-anchor="end">20%</text>
    <!-- 40% -->
    <line x1="90" y1="260" x2="720" y2="260" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="264" text-anchor="end">40%</text>
    <!-- 60% -->
    <line x1="90" y1="200" x2="720" y2="200" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="204" text-anchor="end">60%</text>
    <!-- 80% -->
    <line x1="90" y1="140" x2="720" y2="140" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="144" text-anchor="end">80%</text>
    <!-- 100% -->
    <line x1="90" y1="80" x2="720" y2="80" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="84" text-anchor="end">100%</text>
  </g>

  <!-- Y axis vertical line -->
  <line x1="90" y1="80" x2="90" y2="380" stroke="#94a3b8" stroke-width="1.5"/>

  <!--
    Bars. Each bar is 70px wide. Group of 3 bars is 70*3 + 2*8 spacing = 226px.
    Group 1 (HotpotQA multi-hop) starts at x=160, group 2 (CUAD contracts) starts at x=470.
    Y: 80 = 100%, 380 = 0%. Each percentage point = 3px.
    Values:
      HotpotQA multi-hop:    RedHop 77%, LangChain 71%, LlamaIndex 72%
      CUAD contracts:        RedHop 82%, LangChain 73%, LlamaIndex 86%
  -->

  <!-- Group 1: HotpotQA multi-hop -->
  <!-- RedHop 77% -->
  <rect x="160" y="149" width="70" height="231" fill="#e11d48" rx="2"/>
  <text x="195" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">77%</text>
  <!-- LangChain 71% -->
  <rect x="238" y="167" width="70" height="213" fill="#94a3b8" rx="2"/>
  <text x="273" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">71%</text>
  <!-- LlamaIndex 72% -->
  <rect x="316" y="164" width="70" height="216" fill="#64748b" rx="2"/>
  <text x="351" y="157" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">72%</text>

  <!-- Group 1 label -->
  <text x="273" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">
    HotpotQA multi-hop
  </text>
  <text x="273" y="424" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">
    budget 400 tok · supporting sentence retention
  </text>

  <!-- Group 2: CUAD contracts -->
  <!-- RedHop 82% -->
  <rect x="470" y="134" width="70" height="246" fill="#e11d48" rx="2"/>
  <text x="505" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">82%</text>
  <!-- LangChain 73% -->
  <rect x="548" y="161" width="70" height="219" fill="#94a3b8" rx="2"/>
  <text x="583" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">73%</text>
  <!-- LlamaIndex 86% (best in group) -->
  <rect x="626" y="122" width="70" height="258" fill="#64748b" rx="2"/>
  <text x="661" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">86%</text>

  <!-- Group 2 label -->
  <text x="583" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">
    CUAD contracts
  </text>
  <text x="583" y="424" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">
    budget 2000 tok · answer span retention
  </text>

  <!-- Legend (top right) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">
    <rect x="560" y="64" width="14" height="14" fill="#e11d48" rx="2"/>
    <text x="580" y="75">RedHop</text>
    <rect x="625" y="64" width="14" height="14" fill="#94a3b8" rx="2"/>
    <text x="645" y="75">LangChain</text>
    <rect x="699" y="64" width="14" height="14" fill="#64748b" rx="2"/>
    <text x="719" y="75">LlamaIndex</text>
  </g>

  <!-- Footer note -->
  <text x="380" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">
    Source: docs/findings/FRAMEWORK_COMPARISON.md + docs/findings/CHUNK_GRANULARITY.md · raw: reports/framework_comparison.txt
  </text>
</svg>
