# Standalone workspace: keeps the napi cdylib out of the pure-Rust workspace
# build (so `cargo build --workspace` at the repo root never needs Node).
[workspace]

[package]
name = "redhop-node"
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
description = "Node.js bindings for RedHop context optimization"

[lib]
crate-type = ["cdylib"]

[features]
# Per-platform ORT Execution Provider opt-ins. CI passes the right one
# to `napi build` based on target in .github/workflows/release-node.yml.
# Users who `npm install redhop` get the prebuilt native binary for their
# platform with the matching EP. See docs/design/HYBRID_ACCELERATION_PLAN.md.
ep-coreml   = ["redhop/ep-coreml"]
ep-onednn   = ["redhop/ep-onednn"]
ep-xnnpack  = ["redhop/ep-xnnpack"]
ep-directml = ["redhop/ep-directml"]
ep-cuda     = ["redhop/ep-cuda"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
redhop = { path = "../crates/redhop", features = ["files", "semantic"] }
# Used by `context_economics` to serialize the report as a JSON string for
# the JS side to `JSON.parse`. Already a transitive dep via redhop, just
# made explicit here.
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
