# Standalone workspace: keeps the napi cdylib out of the pure-Rust workspace
# build (so `cargo build --workspace` at the repo root never needs Node).
[workspace]

[package]
name = "redhop-node"
version = "0.3.2"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
description = "Node.js bindings for RedHop context optimization"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi6 + serde-json from before. tokio_rt gives us an embedded tokio
# runtime for `#[napi]` async functions — used by `evaluateWithJudge` to
# drive the Tier-2 LLM-judged metrics from a JS callable without
# blocking the JS event loop (see EVAL_RAGAS_PARITY.md Phase 5).
napi = { version = "2", default-features = false, features = ["napi6", "serde-json", "tokio_rt"] }
napi-derive = "2"
redhop = { path = "../crates/redhop", features = ["files", "semantic"] }
# Used by `context_economics` to serialize the report as a JSON string for
# the JS side to `JSON.parse`. Already a transitive dep via redhop, just
# made explicit here.
serde_json = "1"
# tokio used by `evaluateWithJudge` to spawn the eval onto a blocking
# worker so the JS event loop can service the judge callback. Same
# runtime napi-rs already uses internally via the tokio_rt feature.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
