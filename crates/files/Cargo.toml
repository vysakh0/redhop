[package]
name = "redhop-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lean text extraction (text/markdown/DOCX/…) for RedHop's from_file / from_folder ingestion"

[lib]
path = "src/lib.rs"

[dependencies]
docx-rs    = "0.4"                                              # DOCX
calamine   = "0.32"                                             # XLSX / spreadsheets
zip        = { version = "2", default-features = false, features = ["deflate"] }  # PPTX (OOXML)
quick-xml  = "0.37"                                             # PPTX slide XML
pdf-extract = "0.7"                                             # PDF text (pure-Rust, via lopdf)

[lints]
workspace = true
