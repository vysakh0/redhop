[package]
name = "redhop-embeddings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pluggable embedding backends for RedHop (hashing baseline + optional ONNX)"

[lib]
path = "src/lib.rs"

[features]
default = []
# Enables the ONNX Runtime embedding backend (BGE / E5 / jina / mxbai).
# Pulls in `ort` (ONNX Runtime) + `tokenizers`. NOT in the default build:
# the hashing baseline + pooling + cache are always available with zero
# heavyweight deps.
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
redhop-core          = { workspace = true }
serde                = { workspace = true }
async-trait          = "0.1"
unicode-segmentation = { workspace = true }
lru                  = "0.12"

# ── optional, behind the `onnx` feature ──
# `ort` is pinned exactly: the 2.x release-candidate line churns its
# transitive (ndarray) constraints between RCs. We avoid the `ndarray`
# feature entirely and construct tensors from plain (shape, Vec) pairs,
# which keeps the dependency surface minimal. Pin to whatever RC your
# target machine has a working ONNX Runtime binary for.
ort        = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "download-binaries"] }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tokio = { workspace = true }
