[package]
name = "redhop-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Criterion benchmarks for RedHop"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
redhop-core        = { workspace = true }
redhop-chunking    = { workspace = true }
redhop-retrieval   = { workspace = true }
redhop-pipeline    = { workspace = true }
redhop-diagnostics = { workspace = true }
redhop-embeddings  = { workspace = true }
tokio              = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "chunking"
harness = false

[[bench]]
name    = "retrieval"
harness = false

[[bench]]
name    = "embeddings"
harness = false
