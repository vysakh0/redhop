[package]
name = "redhop-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Criterion benchmarks for RedHop"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
redhop = { workspace = true, features = ["semantic"] }
tokio  = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "chunking"
harness = false

[[bench]]
name    = "retrieval"
harness = false

[[bench]]
name    = "embeddings"
harness = false

[lints]
workspace = true
