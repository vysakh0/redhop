[package]
name = "redhop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Reasoning-aware context runtime for RAG — chunk, retrieve, and allocate the document context an LLM should see, with citations and a Decision Report. No vector DB, in-process."
# Shipped to crates.io so the package page isn't blank. Relative path from the
# crate; cargo bundles the file into the published tarball.
readme = "../../README.md"

# Docs.rs builds with default features only, which hides every item gated
# behind `files` (loaders) or `semantic` (ONNX embedder + cross-encoder).
# Force the published doc page to include them so users see the full API.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/lib.rs"

[features]
default = []
# Built-in document parsers (PDF/DOCX/PPTX/XLSX + text/code/markdown) and the
# `read_file` / `read_bytes` / `read_folder` loaders.
files = [
    "dep:docx-rs",
    "dep:calamine",
    "dep:zip",
    "dep:quick-xml",
    "dep:pdf-extract",
    "dep:ignore",
]
# Semantic retrieval tier: bundled ONNX embedder + model registry, plus the
# cross-encoder reranker. Shares one ONNX runtime / one tokenizers dep.
semantic = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]

# ── Per-platform ORT Execution Provider (EP) opt-ins ──
#
# UNUSED IN PUBLISHED WHEELS as of 0.3.1. Each flag wires up an ORT EP
# for `retrieval="hybrid"`/`"semantic"`, but **none is enabled in CI**
# (.github/workflows/release-*.yml all set `ep: ''`). The wiring is kept
# so a future contributor can re-measure once `ort` or a specific EP
# improves. See docs/findings/HYBRID_LATENCY_PROFILE.md for what we
# measured and docs/design/HYBRID_ACCELERATION_PLAN.md for the plan.
#
# DO NOT enable any of these in published artifacts without re-measuring
# the latency probe (`bench/multihop_hybrid_competitors_probe.py`) on the
# target platform. We measured `ep-coreml` on Apple Silicon at
# ort 2.0.0-rc.10 + bge-small and it REGRESSED hybrid latency (240ms →
# 303ms HotpotQA p50). The other EPs are paper-projected only.
#
# ORT does fall back to CPU per-op when an EP can't run an op, so
# enabling these is technically safe — but the cross-EP boundary memory
# copy can erode any speedup, which is why measurement is mandatory.
ep-coreml   = ["semantic", "ort/coreml"]      # Apple Silicon — MEASURED REGRESSION at ort 2.0.0-rc.10 / bge-small
ep-onednn   = ["semantic", "ort/onednn"]      # Intel CPU on Linux/Windows — unmeasured (+15-25 MB wheel if enabled)
ep-xnnpack  = ["semantic", "ort/xnnpack"]     # ARM CPU on Linux aarch64 — unmeasured (+5-10 MB wheel if enabled)
ep-directml = ["semantic", "ort/directml"]    # Windows GPU (NVIDIA/AMD/Intel via DX12) — unmeasured
ep-cuda     = ["semantic", "ort/cuda"]        # NVIDIA GPU; user-installed CUDA runtime required — unmeasured

[dependencies]
# ── always-on (the lexical-only build pulls only these) ──
serde                = { workspace = true }
serde_json           = { workspace = true }
thiserror            = { workspace = true }
tracing              = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization = "0.1"
regex                = { workspace = true }
rayon                = { workspace = true }
tantivy              = { workspace = true }
tokio                = { workspace = true }
futures              = { workspace = true }
async-trait          = "0.1"
parking_lot          = "0.12"
rust-stemmers        = "1.2"
lru                  = "0.12"

# ── `files` feature (document parsers) ──
docx-rs     = { version = "0.4", optional = true }
calamine    = { version = "0.32", optional = true }
zip         = { version = "2", default-features = false, features = ["deflate"], optional = true }
quick-xml   = { version = "0.37", optional = true }
pdf-extract = { version = "0.7", optional = true }
ignore      = { version = "0.4", optional = true }

# ── `semantic` feature (ONNX embedder + cross-encoder reranker) ──
# `ort` is pinned exactly: the 2.x release-candidate line churns transitive
# (ndarray) constraints between RCs. We avoid the ndarray feature entirely
# and construct tensors from plain (shape, Vec) pairs to keep deps minimal.
ort        = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "download-binaries"] }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }
# Auto-downloads curated ONNX models by name. Sync `ureq` + `rustls-tls`
# (no OpenSSL) for clean Linux/Windows/macOS builds.
hf-hub     = { version = "0.5", optional = true, default-features = false, features = ["ureq", "rustls-tls"] }

# ── dev only ──
# Used by integration tests under `tests/` for staging tempfiles + writing
# adversarial inputs (corrupt DOCX, deep dir trees, symlink loops, etc.).
# Never linked into release builds.
[dev-dependencies]
tempfile = "3"
zip      = { version = "2", default-features = false, features = ["deflate"] }
# Property-based testing — each test states a CLAIM about every possible
# input ("for any random corpus + any random ContextConfig, X holds"),
# and proptest explores the space until either the claim trips or the
# budgeted N runs pass. Catches the bug class hand-written tests miss
# by definition: edge cases the author didn't think of.
proptest = "1"

[lints]
workspace = true
