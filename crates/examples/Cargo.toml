[package]
name = "neorag-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "End-to-end examples for NeoRAG"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
neorag-core        = { workspace = true }
neorag-chunking    = { workspace = true }
neorag-retrieval   = { workspace = true }
neorag-reranking   = { workspace = true }
neorag-diagnostics = { workspace = true }
neorag-storage     = { workspace = true }
neorag-pipeline    = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "diagnostics"
path = "examples/diagnostics.rs"
