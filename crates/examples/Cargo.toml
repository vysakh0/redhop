[package]
name = "redhop-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "End-to-end examples for RedHop"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Enables ONNX-backed examples (real embedding bakeoff + cross-encoder).
# Pulls the onnx feature through redhop-embeddings + redhop-reranking.
onnx = ["redhop-embeddings/onnx", "redhop-reranking/onnx"]

[dependencies]
redhop-core        = { workspace = true }
redhop-chunking    = { workspace = true }
redhop-retrieval   = { workspace = true }
redhop-reranking   = { workspace = true }
redhop-diagnostics = { workspace = true }
redhop-storage     = { workspace = true }
redhop-embeddings    = { workspace = true }
redhop-pipeline      = { workspace = true }
redhop-orchestration = { workspace = true }
redhop-calibration   = { workspace = true }
redhop-observability = { workspace = true }
redhop-context       = { workspace = true }
redhop-document      = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait        = "0.1"
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
parking_lot        = "0.12"
unicode-segmentation = "1.11"
rust-stemmers      = "1.2"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "diagnostics"
path = "examples/diagnostics.rs"

[[example]]
name = "rag_with_claude"
path = "examples/rag_with_claude.rs"

[[example]]
name = "layered_diagnostics"
path = "examples/layered_diagnostics.rs"

[[example]]
name = "regime_classification"
path = "examples/regime_classification.rs"

[[example]]
name = "adaptive_loop"
path = "examples/adaptive_loop.rs"

[[example]]
name = "calibration_sweep"
path = "examples/calibration_sweep.rs"

[[example]]
name = "real_corpus_calibration"
path = "examples/real_corpus_calibration.rs"

[[example]]
name = "neotrace_import"
path = "examples/neotrace_import.rs"

[[example]]
name = "adaptive_eval_hotpotqa"
path = "examples/adaptive_eval_hotpotqa.rs"

[[example]]
name = "adaptive_eval_musique"
path = "examples/adaptive_eval_musique.rs"

[[example]]
name = "method_pair_regret"
path = "examples/method_pair_regret.rs"

[[example]]
name = "observability_report"
path = "examples/observability_report.rs"

[[example]]
name = "ingestion_diagnostics"
path = "examples/ingestion_diagnostics.rs"

[[example]]
name = "distractor_answer_correlation"
path = "examples/distractor_answer_correlation.rs"

[[example]]
