[package]
name = "neorag-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "End-to-end examples for NeoRAG"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Enables ONNX-backed examples (real embedding bakeoff). Pulls the onnx
# feature through neorag-embeddings.
onnx = ["neorag-embeddings/onnx"]

[dependencies]
neorag-core        = { workspace = true }
neorag-chunking    = { workspace = true }
neorag-retrieval   = { workspace = true }
neorag-reranking   = { workspace = true }
neorag-diagnostics = { workspace = true }
neorag-storage     = { workspace = true }
neorag-embeddings    = { workspace = true }
neorag-pipeline      = { workspace = true }
neorag-orchestration = { workspace = true }
neorag-calibration   = { workspace = true }
neorag-observability = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait        = "0.1"
serde_json         = { workspace = true }
parking_lot        = "0.12"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "diagnostics"
path = "examples/diagnostics.rs"

[[example]]
name = "rag_with_claude"
path = "examples/rag_with_claude.rs"

[[example]]
name = "layered_diagnostics"
path = "examples/layered_diagnostics.rs"

[[example]]
name = "regime_classification"
path = "examples/regime_classification.rs"

[[example]]
name = "adaptive_loop"
path = "examples/adaptive_loop.rs"

[[example]]
name = "calibration_sweep"
path = "examples/calibration_sweep.rs"

[[example]]
name = "real_corpus_calibration"
path = "examples/real_corpus_calibration.rs"

[[example]]
name = "neotrace_import"
path = "examples/neotrace_import.rs"

[[example]]
name = "adaptive_eval_hotpotqa"
path = "examples/adaptive_eval_hotpotqa.rs"

[[example]]
name = "adaptive_eval_musique"
path = "examples/adaptive_eval_musique.rs"

[[example]]
name = "method_pair_regret"
path = "examples/method_pair_regret.rs"

[[example]]
name = "observability_report"
path = "examples/observability_report.rs"

[[example]]
name = "ingestion_diagnostics"
path = "examples/ingestion_diagnostics.rs"

[[example]]
name = "real_pdf_validation"
path = "examples/real_pdf_validation.rs"

[[example]]
name = "real_embedding_bakeoff"
path = "examples/real_embedding_bakeoff.rs"
required-features = ["onnx"]

[[example]]
name = "adaptive_real_vs_hashing"
path = "examples/adaptive_real_vs_hashing.rs"
required-features = ["onnx"]

[[example]]
name = "bge_recalibration"
path = "examples/bge_recalibration.rs"
required-features = ["onnx"]

[[example]]
name = "bge_dense_retrieval"
path = "examples/bge_dense_retrieval.rs"
required-features = ["onnx"]
