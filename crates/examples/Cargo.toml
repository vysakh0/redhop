[package]
name = "redhop-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Internal measurement probes for RedHop (Rust-only; see top-level examples/ for the user-facing demos)"
publish = false

[features]
default = []
# Enables ONNX-backed probes (cross-encoder reranking, dense retrieval).
onnx = ["redhop/semantic"]

[dependencies]
redhop               = { workspace = true, features = ["files"] }
tokio                = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow               = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
async-trait          = "0.1"
serde                = { workspace = true, features = ["derive"] }
serde_json           = { workspace = true }
parking_lot          = "0.12"
unicode-segmentation = "1.11"
rust-stemmers        = "1.2"

[lints]
workspace = true

[[example]]
name = "ce_smoke"
path = "examples/ce_smoke.rs"
required-features = ["onnx"]

[[example]]
name = "chat_rag"
path = "examples/chat_rag.rs"

