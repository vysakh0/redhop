[package]
name = "redhop-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "End-to-end examples for RedHop"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Enables ONNX-backed examples (real embedding bakeoff + cross-encoder).
# Pulls the merged `semantic` feature on `redhop`.
onnx = ["redhop/semantic"]

[dependencies]
redhop               = { workspace = true, features = ["files"] }
redhop-diagnostics   = { workspace = true }
redhop-orchestration = { workspace = true }
redhop-pipeline      = { workspace = true }
redhop-calibration   = { workspace = true }
redhop-observability = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait        = "0.1"
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
parking_lot        = "0.12"
unicode-segmentation = "1.11"
rust-stemmers      = "1.2"

